name: Build Docker image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Dockerfile"
      - "compose.yaml"
      - "R/dependencies.R"
      - "scripts/install_dependencies.R"
      - ".github/workflows/docker.yml"

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag pdtomsstats:test .
      - name: Validate image
        run: docker run --rm pdtomsstats:test
      - name: Run repository checks inside the image
        run: |
          docker run --rm pdtomsstats:test Rscript tests/test_structure.R
          docker run --rm pdtomsstats:test Rscript tests/test_example_data.R
      - name: Render the complete de-identified example
        run: >-
          docker run --rm
          --volume "$PWD:/workspace"
          --workdir /workspace
          pdtomsstats:test
          Rscript scripts/run_pipeline.R
          config/example-data.yml
          config/example-data-timecourse.yml
