name: Check repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::data.table
            any::readxl
            any::yaml
      - name: Check files and R syntax
        run: Rscript tests/test_structure.R
      - name: Check the de-identified example
        run: Rscript tests/test_example_data.R
      - name: Check the command wrapper
        run: Rscript tests/test_wrapper_functions.R
      - name: Check the standardized launcher
        run: bash tests/test_cli.sh
