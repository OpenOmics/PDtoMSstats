name: Check repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Check files and R syntax
        run: Rscript tests/test_structure.R
      - name: Check the de-identified example
        run: Rscript tests/test_example_data.R
