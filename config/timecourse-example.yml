# Input created by the main MSstats report.
analysis_file: "results/example-project/msstats_workbook_export_objects.rds"

request: "example-project-timecourse"
report_label: "Example project time-course analysis"
output_dir: "results/example-project/timecourse"
figures_dir: "figures/example-project/timecourse"

# Columns in the annotation saved inside the analysis RDS.
time_column: "Time"
group_column: "Group"
reference_group: "Reference"
comparison_group: "Treatment"

# Time is centered at the first observation and divided by this value before
# polynomial fitting. Use 24 for hours-to-days scaling.
time_unit: 24

# Require this many finite biological replicates in every group-time cell.
min_replicates_per_cell: 4

# maSigPro settings.
polynomial_degree: 3
model_fdr: 0.05
coefficient_alpha: 0.05
min_r_squared: 0.60

# Mfuzz settings. The final cluster count is selected from this range using
# Dmin and cselection diagnostics.
min_clusters: 2
max_clusters: 10
cluster_diagnostic_repeats: 20
core_membership: 0.70

random_seed: 20261007
