project:
  type: website
  output-dir: _site

website:
  title: PDtoMSstats
  description: Portable Proteome Discoverer PSM analysis with MSstats
  site-url: https://openomics.github.io/PDtoMSstats/
  repo-url: https://github.com/OpenOmics/PDtoMSstats
  repo-actions: [source, issue]
  page-navigation: true
  search: true
  navbar:
    background: light
    left:
      - href: index.md
        text: Overview
      - text: Start here
        menu:
          - href: getting-started.md
            text: Getting started
          - href: example.md
            text: Example walkthrough
          - href: input-files.md
            text: Input files
      - text: Run the workflow
        menu:
          - href: docker.md
            text: Docker
          - href: hpc-singularity.md
            text: "HPC: Singularity or Apptainer"
          - href: configuration.md
            text: Configuration
          - href: installation.md
            text: Native installation
      - text: Results
        menu:
          - href: workbook-export.md
            text: Formatted workbook
          - href: timecourse.md
            text: Time-course analysis
      - href: publishing.md
        text: Maintainers
    right:
      - icon: github
        href: https://github.com/OpenOmics/PDtoMSstats
        aria-label: PDtoMSstats on GitHub
  page-footer:
    left: PDtoMSstats · OpenOmics
    right: Built with [Quarto](https://quarto.org/)

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-location: right
    code-copy: true
    code-overflow: wrap
    smooth-scroll: true
    link-external-newwindow: true

execute:
  freeze: true
